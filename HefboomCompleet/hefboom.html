<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hefboom - Muzieknoot Spel</title>
<link rel="stylesheet" href="hefboom.css">

<div class="page hefboom-wrapper">
  <h1>Hefboom spel</h1>
  <div class="opdracht">
    Verschuif het draaipunt en lanceer de muzieknoot in het doel! 🎯
  </div>

  <div class="arena">
    <canvas id="gameCanvas"></canvas>
  </div>

  <div class="status-row">
    <span>Score: <span id="score">0</span></span>
    <span id="message" class="message"></span>
  </div>

  <div class="slider-section">
    <span>Draaipunt</span>
    <input type="range" id="pivotSlider" min="10" max="88" value="35">
    <span id="pivotPct">35%</span>
  </div>

  <div class="code-row">
    <span class="code-label">Code:</span>
    <span class="digit" id="d1">-</span>
    <span class="digit" id="d2">-</span>
    <span class="digit" id="d3">-</span>
  </div>

  <div class="btn-row">
    <button class="btn-launch" id="launchBtn">Lanceer muzieknoot 🎵</button>
    <button id="resetBtn">Reset</button>
  </div>
</div>

<script src="hefboom.js"></script>
