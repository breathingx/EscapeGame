<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hefboom - Muzieknoot Spel</title>
  <!-- <link rel="stylesheet" href="katapult.css"> -->
</head>
<body>

<div class="page katapult-wrapper">
  <!-- <h1>Hefboom spel</h1>
  <div class="opdracht">
    Stel de kracht van de katapult in en schiet de noot op de juiste sport van de ladder!
    Raak alle noten, of ga verder zodra je minstens 1 punt hebt.
  </div> -->

  <div class="arena">
    <canvas id="gameCanvas" role="img"
      aria-label="Een katapult schiet een muzieknoot naar een ladder met vijf sporten: Do, Re, Mi, Fa en So."></canvas>
  </div>

  <div class="status-row">
    <span>Score: <span id="score">0</span> / <span id="scoreMax">5</span></span>
    <span>Jouw noot: <strong id="targetName">-</strong></span>
    <span id="message" class="message" role="status" aria-live="polite"></span>
  </div>

  <div class="slider-section">
    <label for="strengthSlider">Kracht</label>
    <input type="range" id="strengthSlider" min="0" max="100" value="30">
    <span id="strengthPct">30%</span>
  </div>

  <div class="btn-row">
    <button class="btn-launch" id="launchBtn">Lanceer muzieknoot</button>
    <button id="hefboomVerderBtn" disabled>Verder</button>
  </div>
</div>

<script src="hefboom.js"></script>
</body>
</html>
