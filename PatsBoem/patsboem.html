<div id="patsboem-wrapper">
    <div class="patsboem-buttons-container">
        <div class="pb-btn-col">
            <button class="pb-circle-btn" id="btn-boem" onclick="incrementPatsBoem('boem')">0</button>
            <span class="pb-label">Boem</span>
        </div>
        <div class="pb-btn-col">
            <button class="pb-circle-btn" id="btn-pats" onclick="incrementPatsBoem('pats')">0</button>
            <span class="pb-label">Pats</span>
        </div>
        <div class="pb-btn-col">
            <button class="pb-circle-btn" id="btn-rust" onclick="incrementPatsBoem('rust')">0</button>
            <span class="pb-label">Rust</span>
        </div>
    </div>
    
    <div class="pb-controls">
        <button id="pb-reset-btn" onclick="resetPatsBoem()">Reset</button>
    </div>
</div>
