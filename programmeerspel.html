<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Blockly Minigame</title>
  
  <link rel="stylesheet" href="style.css">
  <script src="utils/blockly.min.js"></script>
  <script src="utils/javascript_compressed.js"></script>
</head>
<body class="game-page">

  <h1 class="start-title" style="margin-top: var(--page-margin);">LEID HET MANNETJE NAAR DE VLAG</h1>
  
  <div class="game-container">
  <div id="blocklyDiv"></div>
  <div id="gameArea">
    <div id="goal" style="position: absolute;">🚩</div>
    <div id="player" style="position: absolute; transform: translate(0px, 0px) rotate(0deg); z-index: 10;">🧍</div>
  </div>
</div>

  <div class="action-button-wrapper">
    <button class="run-btn" onclick="runGame()">▶ SPEEL PROGRAMMA</button>
  </div>

  <xml id="workspaceBlocks" style="display: none">
    <block type="start_block" x="20" y="20"></block>
  </xml>

  <xml id="toolbox" style="display: none">
    <block type="move_forward"></block>
    <block type="turn_left"></block>
    <block type="turn_right"></block>
    <block type="repeat_n"></block>
  </xml>
  <script src="blockscript.js"></script>
</body>
</html>
