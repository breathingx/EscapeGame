<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Codes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="timer"></div>
<div id="scoreDisplay"></div>

<div id="codesContainer">

    <div id="eigenTeamBlok" class="teamCodeBlok">
        <h1 id="eigenTeamTitel"></h1>
        <p id="eigenCode"></p>
    </div>

    <div class="teamCodeBlok" id="team2Blok">
        <h2 id="team2Naam"></h2>
        <input type="text" id="team2Input" placeholder="Voer code in">
    </div>

    <div class="teamCodeBlok" id="team3Blok">
        <h2 id="team3Naam"></h2>
        <input type="text" id="team3Input" placeholder="Voer code in">
    </div>

    <button onclick="controleerCodes()">Controleer Codes</button>

    <p id="codeFeedback"></p>

</div>

<img src="logo.png" alt="Logo" class="logo">

<script src="script.js"></script>
</body>
</html>
