<!DOCTYPE html>
<html>
<head>
<style>
  .pressing-image {
  height: 200px;
  opacity: 0;
}

.play-animation {
  animation: fade-move-bounce 1s ease-in-out forwards;
}

@keyframes fade-move-bounce {
  0% {
    transform: translateY(0);
  }
  10% {
    opacity: 0;
  }
  
  30% {
    opacity: 1;
  }

  50% {
    transform: translateY(50px);
  }

  70% {
    opacity: 1;
  }
  90% {
    opacity: 0;
  }

  100% {
    transform: translateY(0);
  }
}
  body {
    background-color: #f0f0f0;
    display: flex;
    align-items: center;
    height: 100vh;
  }
</style>
</head>
<body>

  <img id="toon" src="toon.png" class="pressing-image" alt="Animated Element">
  <button onclick="startAnim()">Play Animation</button>
</body>

<script>
function startAnim() {
  const img = document.getElementById('toon');
  
  // Remove the class first (so you can click it again to restart)
  img.classList.remove('play-animation');
  
  // Trigger a "reflow" so the browser notices the class was removed
  void img.offsetWidth; 
  
  // Add the class to start the animation
  img.classList.add('play-animation');
}
</script>
</html>
