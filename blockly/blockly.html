<div class="game-container">
  
  <!-- Left Column -->
  <div class="left-panel">
    <div id="blocklyDiv"></div>
    <div class="action-button-wrapper">
      <button id="runBlocklyBtn" onclick="runGame()" class="run-btn">▶ SPEEL PROGRAMMA</button>
    </div>
  </div>

  <!-- Right Column -->
  <div class="right-panel">
    <div class="stats-sidebar">
      <div class="stat-box">
        <span class="stat-label">Blokken</span>
        <span id="blockCount" class="stat-value">0/10</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">Score</span>
        <span id="currentScore" class="stat-value">0</span>
      </div>
    </div>

    <div id="gameArea">
      <div id="player" style="position: absolute; z-index: 10;"><span style="display: inline-block; transform: scaleX(-1);">🚶</span></div>
    </div>

    <!-- Advance button moved to the right column -->
    <div class="action-button-wrapper">
      <button id="advance-blockly" style="display: none;" class="run-btn advance-btn">Verder</button>
    </div>
  </div>

</div>
<xml id="workspaceBlocks" style="display: none">
  <block type="start_block" x="10" y="10"></block>
</xml>

<xml id="toolbox" style="display: none">
  <block type="move_forward_n"></block>
  <block type="turn_left"></block>
  <block type="turn_right"></block>
  <block type="repeat_n"></block>
</xml>
