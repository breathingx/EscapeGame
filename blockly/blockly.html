<div class="minigame">

  <!-- <h1>Pak zo veel mogelijk muzieknoten!</h1> -->

    <div class="game-container">
  <div id="blocklyDiv"></div>

  <div class="stats-sidebar">
    <div class="stat-box">
      <span class="stat-label">Blokken</span>
      <span id="blockCount" class="stat-value">0/11</span>
    </div>
    <div class="stat-box">
      <span class="stat-label">Score</span>
      <span id="currentScore" class="stat-value">0</span>
    </div>
  </div>

  <div id="gameArea">
    <div id="player" style="position: absolute; z-index: 10;"><span style="display: inline-block; transform: scaleX(-1);">🚶</span></div>
  </div>
</div>

  <button onclick="runGame()">▶ SPEEL PROGRAMMA</button>
</div>

<xml id="workspaceBlocks" style="display: none">
  <block type="start_block" x="10" y="10"></block>
</xml>

<xml id="toolbox" style="display: none">
  <block type="move_forward_n"></block>
  <block type="turn_left"></block>
  <block type="turn_right"></block>
  <block type="repeat_n"></block>
</xml>
