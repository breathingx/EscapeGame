<div id="soundmatch" class="sm">

    <p id="sm-status" class="sm-status"></p>

    <button id="sm-play" class="sm-play" type="button" aria-label="Speel geluid">
        <svg class="sm-speaker" viewBox="0 0 64 64" aria-hidden="true">
            <path class="sm-speaker-body" d="M8 24h12l14-12v40L20 40H8z"/>
            <path class="sm-wave sm-wave1" d="M42 24c4 4 4 12 0 16"/>
            <path class="sm-wave sm-wave2" d="M48 17c8 8 8 22 0 30"/>
            <path class="sm-wave sm-wave3" d="M54 10c12 12 12 32 0 44"/>
        </svg>
        <span class="sm-play-label">Speel geluid!</span>
    </button>

    <div class="sm-carousel">
        <button id="sm-prev" class="sm-arrow sm-arrow-left" type="button" aria-label="Vorige">&#8249;</button>
        <div id="sm-track" class="sm-track"></div>
        <button id="sm-next" class="sm-arrow sm-arrow-right" type="button" aria-label="Volgende">&#8250;</button>
    </div>

    <button id="sm-action" class="sm-action" type="button" disabled>Kies dit instrument</button>

    <div id="sm-boxes" class="sm-boxes"></div>

</div>
