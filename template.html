<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="game-page">

<!-- voor de minigames -->
 <script type="importmap">
{
  "imports": {
    "gl-matrix": "https://cdn.jsdelivr.net/npm/gl-matrix@3.4.4/+esm"
  }
}
</script>
<!-- ---------------------------- -->

<div class="header">
    <div id="timer"></div>
    <div id="scoreDisplay">Score: 0</div>
</div>

<div class="subheader">
    <h2 id="teamTitel"></h2>
    <h3 id="opdrachtNummer"></h3>
</div>


<div class="main-content">

    <div id="vraagContainer">

    <h2 id="opdrachtTitel"></h2>

    <div id="uitlegBlok">
        <p id="uitlegTekst"></p>
    </div>

    <div id="extraContent"></div>

    <div id="codeInputContainer">
        <input type="text" id="antwoordInput" placeholder="Voer antwoord in" autocomplete="off">
    </div>

    <div id="truth-lie-div" hidden>
        <!-- TODO ipv 'waar' en 'niet waar' '1' en '0' in de knopjes neetzetten? -->
        <button id="truth-lie-ja" onclick="verwerkTruthLie(true)" hidden ="true">Waar</button>
        <button id="truth-lie-nee" onclick="verwerkTruthLie(false)" hidden="true">Niet waar</button>
        <button id="VolgendeTruthLie" onclick="updateTruthLie()" hidden="true">Volgende</button>
    </div>
    <div id="MC-vragen" hidden="true">
        <div class="mc-grid">
            <!-- TODO kies betere kleuren? -->
            <div class="MC-btn green" id="MC-0" data-index="0" hidden="true"></div>
            <div class="MC-btn red" id="MC-1" data-index="1" hidden="true"></div>
            <div class="MC-btn yellow" id="MC-2" data-index="2" hidden="true"></div>
            <div class="MC-btn blue" id="MC-3" data-index="3" hidden="true"></div>
        </div>
    </div>

    <button id="actieBtn" onclick="verwerkActie()">Controleer</button>
    <p id="feedback"></p>

</div>

</div>


<div id="hintContainer">

    <div class="hintLeft">
        <button id="hintBtn" onclick="geefHint()">Hint</button>

        <div id="hintBlocks">
            <span class="hintBlock"></span>
            <span class="hintBlock"></span>
            <span class="hintBlock"></span>
        </div>
    </div>

    <button id="bonusBtn" onclick="toonBonusPopup()">Bonus</button>

</div>

<p id="hintText"></p>

<div class="hud-footer">
    <img src="M3L.png" alt="Logo" class="logo">

    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>
</div>


<div id="hintOverlay">
    <div id="hintModal">
        <button id="closeHint">&times;</button>
        <p id="hintTitle" style="display:none; font-weight: bold; margin-bottom: 10px;">
            Hint:
        </p>
        <p id="hintModalText"></p>

        <div id="hintActions" style="display:none; margin-top:20px;">
            <button id="confirmHint">Ja, gebruik hint</button>
            <button id="cancelHint">Annuleer</button>
        </div>

    </div>
</div>

<div id="bonusOverlay">
    <div id="bonusModal">

        <button id="closeBonus">&times;</button>
        <h2>Bonusvragen</h2>
        <div id="bonusLijst"></div>

    </div>
</div>


<script src="script.js"></script>
</body>
</html>
