<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="game-page">

<!-- voor de minigames -->
 <script type="importmap">
{
  "imports": {
    "gl-matrix": "https://cdn.jsdelivr.net/npm/gl-matrix@3.4.4/+esm"
  }
}
</script>

<!-- voor leuke confetti! Copyright (c) 2020, Kiril Vatev, added by TeamTim on 2026-09-14-->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
<!-- ---------------------------- -->

<div class="header">
    <div id="header_column_left">
        <div id="timerTitle">tijd over</div>
        <div id="timer"></div>
    </div>

    <div id="header_column_center">
        <h3>Team</h3>
        <h3 id="teamTitel"></h3>
        <h4 id="opdrachtNummer"></h4>
    </div>

    <div id="header_column_right">
                <div id="scoreTitle">score</div>
        <div id="scoreDisplay">00000</div>
    </div>
    
</div>



<div class="main-content">

    <div id="vraagContainer">

    
    <div id="uitlegWrapper">
        <h2 id="opdrachtTitel"></h2>
        <div id="uitlegBlok">
            <p id="uitlegTekst"></p>
        </div>
    </div>

    <div id="extraContent"></div>

    <div id="codeInputContainer">
        <input type="text" id="antwoordInput" placeholder="Voer antwoord in" autocomplete="off">
    </div>

    <div id="truth-lie-answer-container" hidden>
        <div class="truth-lie-answer-chip" id="truth-lie-Q1" hidden="true"></span></div>
        <div class="truth-lie-answer-chip" id="truth-lie-Q2" hidden="true"></span></div>
        <div class="truth-lie-answer-chip" id="truth-lie-Q3" hidden="true"></span></div>
        <div class="truth-lie-answer-chip" id="truth-lie-Q4" hidden="true"></span></div>
        <div class="truth-lie-answer-chip" id="truth-lie-Q5" hidden="true"></span></div>
        <div class="truth-lie-answer-chip" id="truth-lie-Q6" hidden="true"></span></div>
    </div>
    <div id="truth-lie-div" hidden>
        <button id="truth-lie-nee" onclick="verwerkTruthLie(false)" hidden ="true">Niet Waar</button>
        <button id="truth-lie-ja" onclick="verwerkTruthLie(true)" hidden="true">Waar</button>
        <button id="truth-lie-next" onclick="endTruthLie()" hidden="true">Volgende</button>
    </div>
    <div id="MC-vragen" hidden="true">
        <div class="mc-grid">
            <div class="MC-btn green" id="MC-0" data-index="0" hidden="true"></div>
            <div class="MC-btn red" id="MC-1" data-index="1" hidden="true"></div>
            <div class="MC-btn yellow" id="MC-2" data-index="2" hidden="true"></div>
            <div class="MC-btn blue" id="MC-3" data-index="3" hidden="true"></div>
        </div>
    </div>

    <button id="actieBtn" onclick="verwerkActie()">Controleer</button>
    <p id="feedback"></p>

</div>

</div>


<div id="hintContainer">

    <div class="hintLeft">
        <button id="hintBtn" onclick="geefHint()">Hint</button>

        <div id="hintBlocks">
            <span class="hintBlock"></span>
            <span class="hintBlock"></span>
            <span class="hintBlock"></span>
        </div>
    </div>

    <button id="bonusBtn" onclick="toonBonusPopup()">Bonus</button>

</div>

<p id="hintText"></p>

<div class="hud-footer">
    <img id="logo" src="M3L.png" alt="Logo" class="logo">

    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>
</div>


<div id="hintOverlay">
    <div id="hintModal">
        <button id="closeHint">&times;</button>
        <p id="hintTitle" style="display:none; font-weight: bold; margin-bottom: 10px;">
            Hint:
        </p>
        <p id="hintModalText"></p>

        <div id="hintActions" style="display:none; margin-top:20px;">
            <button id="confirmHint">Ja, gebruik hint</button>
            <button id="cancelHint">Annuleer</button>
        </div>

    </div>
</div>

<div id="bonusOverlay">
    <div id="bonusModal">

        <button id="closeBonus">&times;</button>
        <h2>Bonusvragen</h2>
        <div id="bonusLijst"></div>

    </div>
</div>


<script src="script.js"></script>
<!-- alleen voor presentatie -->
<script src="presentatie.js"></script>
<!--  -->
</body>
</html>
