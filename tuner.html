<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Working Guitar Tuner</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 2rem; }
    span { font-weight: bold; }
  </style>
</head>
<body>
  <h1>Guitar Tuner</h1>
  <p>Play a string and the page will tell you if it's in tune.</p>
  <p>Detected Note: <span id="note">-</span></p>
  <p>Tune: <span id="tune">-</span></p>

  <script>
    // Standard guitar tuning (Hz)
    const guitarNotes = {
      //'E2': 82.41,
      'E2': 166.81,
    //   'A2': 110.00,
    'A2': 174.8,
    //   'D3': 146.83,
    'D3': 297,
    'G3': 393.4,
    //   'G3': 196.00,
    'B3': 500,
    //   'B3': 246.94,
    //   'E4': 329.63
    'E4': 666.7
    };

    const noteNames = Object.keys(guitarNotes);
    const noteFreqs = Object.values(guitarNotes);

    const noteElem = document.getElementById('note');
    const tuneElem = document.getElementById('tune');

    async function startTuner() {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const source = audioCtx.createMediaStreamSource(stream);
      const analyser = audioCtx.createAnalyser();
      analyser.fftSize = 2048;
      source.connect(analyser);

      const buffer = new Float32Array(analyser.fftSize);

      function autoCorrelate(buf, sampleRate) {
        let SIZE = buf.length;
        let rms = 0;
        for (let i = 0; i < SIZE; i++) rms += buf[i]*buf[i];
        rms = Math.sqrt(rms/SIZE);
        if (rms < 0.01) return -1; // silence

        // NEW
        // Normalized autocorrelation
        let corr = new Array(SIZE).fill(0);
        for (let lag = 0; lag < SIZE/2; lag++) {
          let sum = 0;
          for (let i = 0; i < SIZE/2; i++) {
            sum += buf[i] * buf[i + lag];
          }
          corr[lag] = sum / (SIZE/2);
        }
        /////////////////////////////

        let maxShift = SIZE/2;
        let bestOffset = -1;
        let bestCorrelation = 0;
        for (let offset = 20; offset < maxShift; offset++) {
          let correlation = 0;
          for (let i = 0; i < maxShift; i++) {
            correlation += Math.abs(buf[i] - buf[i+offset]);
          }
          correlation = 1 - correlation/maxShift;
          if (correlation > bestCorrelation) {
            bestCorrelation = correlation;
            bestOffset = offset;
          }
        }
        if (bestCorrelation > 0.9) {
          return sampleRate / bestOffset;
        }
        return -1;
      }

      function getClosestNote(freq) {
        let minDiff = Infinity;
        let closestNote = null;
        for (let i = 0; i < noteFreqs.length; i++) {
          let diff = Math.abs(freq - noteFreqs[i]);
          if (diff < minDiff) {
            minDiff = diff;
            closestNote = noteNames[i];
          }
        }
        return closestNote;
      }

      function checkTuning(freq, targetFreq) {
        let cents = 1200 * Math.log2(freq/targetFreq);
        if (Math.abs(cents) < 5) return 'In Tune';
        return cents > 0 ? 'Tune Lower' : 'Tune Higher';
      }

      function update() {
        analyser.getFloatTimeDomainData(buffer);
        const freq = autoCorrelate(buffer, audioCtx.sampleRate);
        if (freq !== -1) {
          const note = getClosestNote(freq);
          noteElem.textContent = note + ' (' + freq.toFixed(1) + ' Hz)';
          tuneElem.textContent = checkTuning(freq, guitarNotes[note]);
        } else {
          noteElem.textContent = '-';
          tuneElem.textContent = '-';
        }
        requestAnimationFrame(update);
      }

      update();
    }

    startTuner().catch(err => alert('Error accessing microphone: ' + err));
  </script>
</body>
</html>
