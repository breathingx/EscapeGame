<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="main-content">
    <div class="content-wrapper">

        <h1>Welkom bij het spel</h1>
        <p>Kies een team:</p>

        <div class="team-buttons">
            <button id="continueBtn">Spel Hervatten</button>
            <p id="continueText">LET OP: Als je weer een team kiest, wordt je huidige voortgang gewist!</p>
            <button class="programma" onclick="startGame('programma')">Programma</button>
            <button class="klankbron" onclick="startGame('klankbron')">Klankbron</button>
            <button class="aandrijving" onclick="startGame('aandrijving')">Machines</button>
        </div>

        <!--  -->
        <button class="presentatie" onclick="startPresentatie()">
            Minigames
        </button>
        <!--  -->
        
    </div>
</div>

<img src="logo.png" alt="Logo" class="logo">

<script src="script.js"></script>
<!-- alleen voor presentatie -->
<script src="presentatie.js"></script>
<!--  -->
</body>
</html>
